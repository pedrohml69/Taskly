<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/css/base.css">
    <link rel="stylesheet" href="../styles/css/login.css">
    <title>Taskly | Redefinir senha</title>
</head>
<body>
    <main>
        <div class="squares"></div>
        <div class="form-part">
            <a href="./login.html"><button class="back-button" type="button"><img src="../styles/img/arrow-wh.png" alt=""></button></a>
            <form id="resetPasswordForm" novalidate hidden>
                <h1>Redefinir senha</h1>
                <p id="resetEmail" aria-live="polite"></p>
                <label for="newPassword">Nova senha</label>
                <div class="password-field">
                    <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
                    <button class="password-toggle" type="button" data-target="newPassword" aria-label="Mostrar nova senha">Mostrar</button>
                </div>
                <label for="confirmPassword">Confirmar senha</label>
                <div class="password-field">
                    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
                    <button class="password-toggle" type="button" data-target="confirmPassword" aria-label="Mostrar confirmação da senha">Mostrar</button>
                </div>
                <p id="resetStatus" role="status" aria-live="polite"></p>
                <button id="confirmReset" type="submit">Salvar nova senha</button>
            </form>
            <p id="resetNotice" role="status" aria-live="polite">Validando o link de redefinição...</p>
            <p id="loginReturn" hidden>Você já pode <a href="./login.html">voltar ao login</a>.</p>
            <p id="requestAnother" hidden>Solicite um <a href="./forgot-password.html">novo link de redefinição</a>.</p>
        </div>
    </main>
    <script type="module" src="../scripts/reset-password.js"></script>
</body>
</html>
