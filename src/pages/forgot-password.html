<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/css/base.css">
    <link rel="stylesheet" href="../styles/css/login.css">
    <title>Recuperar senha - Taskly</title>
</head>
<body>
    <main>
        <div class="squares"></div>
        <div class="form-part">
            <a href="./login.html"><button class="back-button" type="button"><img src="../styles/img/arrow-wh.png" alt=""></button></a>
            <form id="forgotPasswordForm" novalidate>
                <h1>Recuperar senha</h1>
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>
                <p id="requestStatus" role="status" aria-live="polite"></p>
                <button id="sendResetLink" type="submit">Enviar link</button>
            </form>
            <p style="text-align: center; width: 100%;">Lembrou sua senha? <a href="./login.html">Entrar</a></p>
        </div>
    </main>
    <script type="module" src="../scripts/forgot-password.js"></script>
</body>
</html>
