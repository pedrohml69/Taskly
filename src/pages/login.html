    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../styles/css/base.css">
        <link rel="stylesheet" href="../styles/css/login.css">
        <title>Document</title>
    </head>
    <body>
        <main>
            <div class="squares">
            </div>
            <div class="form-part">
                <a href="../index.html"><button class="back-button"><img src="../styles/img/arrow-wh.png" alt=""></button></a>
                <form id="loginForm" novalidate>
                    <h1>Entrar</h1>
                    <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>
                    <input id="password" name="password" type="password" placeholder="Senha" autocomplete="current-password" required>
                    <button type="submit">Entrar</button>
                </form>
                <p style="text-align: center; width: 100%;">Não tem uma conta? <a href="../pages/register.html">Crie aqui</a></p>
            </div>
        </main>

        <script type="module" src="../scripts/auth-guard.js"></script>
        <script type="module" src="../scripts/login.js"></script>
    </body>
    </html>
