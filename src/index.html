<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/css/base.css">
    <link rel="stylesheet" href="./styles/css/index.css">

    <title>Taskly</title>
</head>

<body>

    <nav>

        <div class="logo-links">
            <h1>Taskly</h1>
        </div>

        <div class="account">

            <p>
                Já tem uma conta?

                <a href="./pages/login.html">
                    Entrar
                </a>
            </p>

        </div>

    </nav>


    <main>

        <div class="container">

            <div class="action-text">

                <p class="tag">
                    #1 Taskmanager
                </p>

                <h2>
                    Bem<br>
                    vindo ao<br>
                    <strong>Taskly</strong>
                </h2>

                <p class="description">
                    Organize suas tarefas de forma
                    eficiente e produtiva.
                </p>

                <a
                    href="./pages/register.html"
                    style="text-decoration: none;"
                >

                    <button class="action-button">

                        Comece Agora!

                        <img
                            src="./styles/img/arrow-wh.png"
                            alt=""
                        >

                    </button>

                </a>

            </div>


            <div class="action-img">
            </div>

        </div>

    </main>


    <footer class="site-footer">
        <div class="footer-content">
            <p class="footer-message">
                <strong>Taskly</strong>
                <span>Organize suas tarefas de forma eficiente e produtiva.</span>
            </p>
            <div class="footer-divider" aria-hidden="true"></div>
            <small class="footer-year">2026</small>
        </div>
    </footer>
